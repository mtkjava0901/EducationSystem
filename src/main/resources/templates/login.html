<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link th:href="@{css/bootstrap.min.css}" rel="stylesheet">
	<link th:href="@{css/style.css}" rel="stylesheet">
	<title>視聴覚教材貸し出し</title>
</head>

<body id="loginPage">
	<div class="container">

		<div class="row justify-content-center">
			<div class="col col-md-6 mt-4">

				<div class="panel panel-default text-center">
					<h1 class="h3">ログイン</h1>
					<div class="panel-body">

						<form th:action="@{/login}" th:object="${loginForm}" method="post">

							<!-- 上部エラー表示 -->
							<div th:if="${#fields.hasErrors('*')} or ${loginError != null}" class="alert alert-danger">
								<ul class="m-0 p-0 list-unstyled">
									<!-- フィールドごとの必須入力エラー -->
									<li th:each="err : ${#fields.errors('loginId')}" th:text="${err}"
										th:if="${loginError == null}"></li>
									<li th:each="err : ${#fields.errors('loginPass')}" th:text="${err}"
										th:if="${loginError == null}"></li>
									<!-- 認証エラー -->
									<li th:if="${loginError != null}" th:text="${loginError}"></li>
								</ul>
							</div>

							<!-- ログインID -->
							<div class="mb-3">
								<input type="text" th:field="*{loginId}" class="form-control" placeholder="ログインID">
							</div>

							<!-- パスワード -->
							<div class="mb-3">
								<input type="password" th:field="*{loginPass}" class="form-control" placeholder="パスワード">
							</div>

							<div class="mb-3">
								<input type="submit" class="btn btn-primary w-100" value="ログイン">
							</div>

						</form>

					</div>
				</div>

			</div><!-- /.col- -->
		</div><!-- /.row -->

	</div><!-- /.container -->
	<script th:src="@{js/jquery-3.6.1.min.js}"></script>
	<script th:src="@{js/bootstrap.bundle.min.js}"></script>
</body>

</html>
