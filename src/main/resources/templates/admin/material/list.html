<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
	<link th:href="@{/css/style.css}" rel="stylesheet">
	<title>教材管理システム</title>
</head>

<body>
	<header>
		<nav class="navbar navbar-light bg-light">
			<div class="container">
				<a class="navbar-brand" href="">教材管理システム</a>
				<ul class="navbar-nav">
					<li class="nav-item">
						<span th:text="${username}">(アカウント名)</span>
						[<a th:href="@{/admin/logout}">ログアウト</a>]
					</li>
				</ul>
			</div>
		</nav>
	</header>
	<div class="container">

		<h1 class="my-4 h3">視聴覚教材リスト</h1>

		<div class="row">
			<div class="col">
				<p>
					<a th:href="@{/admin/material/add}" class="btn btn-primary">視聴覚教材の追加</a>
					<a th:href="@{/admin/student/list}" class="btn btn-light">生徒リスト</a>
					<a th:href="@{/admin/material/deleted}" class="btn btn btn-outline-secondary">削除済み教材一覧</a>
					<a href="" class="btn btn btn-outline-secondary">削除済み生徒一覧</a>
				</p>

				<!-- フラッシュメッセージ欄 -->
				<div th:if="${statusMessage}" class="alert alert-success" role="alert">
					<span th:text="${statusMessage}"></span>
				</div>
				<!-- フラッシュメッセージ欄 -->

				<!-- 教材テーブル -->
				<table class="table table-bordered">
					<tr>
						<th>教材名</th>
						<th>種類</th>
						<th>登録日</th>
						<th>編集</th>
						<th>削除</th>
					</tr>
					<tr th:each="material : ${list}">
						<td><a th:href="@{/admin/material/show/{id}(id=${material.id})}">
								[[ ${material.name} ]]
							</a></td>
						<td>[[ ${material.materialType.name} ]]</td>
						<td>[[ ${#temporals.format
							(material.created, 'yyyy年MM月dd日(E) hh時mm分ss秒')} ]]</td>
						<td>
							<a th:href="@{/admin/material/edit/{id}(id=${material.id})}"
								class="btn btn-warning btn-sm">編集</a>
						</td>
						<td>
							<a th:href="@{/admin/material/delete/{id}(id=${material.id})}"
								class="btn btn-danger btn-sm delete">
								削除
							</a>
						</td>
					</tr>
				</table>
				<!-- 教材テーブル -->

				<!-- ページネーション -->
				<div th:if="${totalPages >= 2}" class="container">
					<ul class="pagination">
						<!-- 前のページへ -->
						<th:block th:switch="${page}">
							<li th:case="1" class="page-item disabled">
								<a class="page-link" href="">&laquo;</a>
							</li>
							<li th:case="*" class="page-item">
								<a class="page-link" th:href="@{/admin/material/list(page=${page - 1})}">&laquo;</a>
							</li>
						</th:block>
						<!-- ページ番号 -->
						<th:block th:each="index : ${#numbers.sequence(1, totalPages)}">
							<th:block th:switch="${index}">
								<li th:case="${page}" class="page-item active">
									<a class="page-link" href="">[[ ${index} ]]</a>
								</li>
								<li th:case="*" class="page-item">
									<a class="page-link" th:href="@{/admin/material/list(page=${index})}">[[ ${index}
										]]</a>
								</li>
							</th:block>
						</th:block>
						<!-- 次のページへ -->
						<th:block th:switch="${page}">
							<li th:case="${totalPages}" class="page-item disabled">
								<a class="page-link" href="">&raquo;</a>
							</li>
							<li th:case="*" class="page-item">
								<a class="page-link" th:href="@{/admin/material/list(page=${page + 1})}">&raquo;</a>
							</li>
						</th:block>
					</ul>
				</div>
				<!-- ページネーション -->
				
				<!-- バックアップ -->
				<!--	<li class="page-item disabled"><a class="page-link" href="">&laquo;</a></li> -->
				<!--	<li class="page-item active"><a class="page-link" href="">1</a></li> -->
				<!--	<li class="page-item"><a class="page-link" href="">2</a></li> -->
				<!--	<li class="page-item"><a class="page-link" href="">3</a></li> -->
				<!--	<li class="page-item"><a class="page-link" href="">&raquo;</a></li> -->
				<!-- バックアップ -->

			</div><!-- /.col- -->
		</div><!-- /.row -->

	</div><!-- /.container -->
	<script th:src="@{/js/jquery-3.6.1.min.js}"></script>
	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/js/button-action.js}"></script>
</body>

</html>
