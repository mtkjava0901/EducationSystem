<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
	<link th:href="@{/css/style.css}" rel="stylesheet">
	<title>教材管理システム</title>
</head>

<body>
	<header>
		<nav class="navbar navbar-light bg-light">
			<div class="container">
				<a class="navbar-brand" href="">教材管理システム</a>
				<ul class="navbar-nav">
					<li class="nav-item">
						<span th:text="${username}">(アカウント名)</span>
						[<a href="">ログアウト</a>]
					</li>
				</ul>
			</div>
		</nav>
	</header>
	<div class="container">

		<h1 class="my-4 h3">[[ ${material.name} ]]</h1>

		<div class="row">
			<div class="col">
				<table class="table table-bordered">
				 	<tbody>
						<tr>
							<th>種類</th>
							<td>[[ ${material.materialType.name} ]]</td>
						</tr>
						<tr>
							<th>出版元</th>
							<td>[[ ${material.publisher} ]]</td>
						</tr>
						<tr>
							<th>備考</th>
							<td>[[ ${material.note} ]]</td>
						</tr>
						<tr>
							<th>登録日</th>
							<td>[[ ${#temporals.format(material.created,
								'yyyy年MM月dd日(E) HH時mm分ss秒')} ]]</td>
						</tr>
						
						<tr>
							<th>貸し出し記録</th>
							<td>
								<!---->
									<div th:if="${#lists.isEmpty(recentRecords)}">
										貸し出し履歴はありません。
									</div>
									<div th:each="record : ${recentRecords}" class="mb-2">
										<span th:text="${record.student.name}">学生名</span>
										<span th:text="${#temporals.format(record.borrowedAt, 'yyyy年M月dd日(E) HH時mm分ss秒')}">借りた日</span>
										～
										<span th:text="${record.returnedAt != null ? #temporals.format(record.returnedAt, 'yyyy年M月dd日(E) HH時mm分ss秒') : '未返却'}">返却日</span>
									</div>
							</td>
						</tr>
					</tbody>
				</table>

				<p>
					<a th:href="@{/admin/material/list}" class="btn btn-primary">リストに戻る</a>
				</p>

			</div><!-- /.col- -->
		</div><!-- /.row -->

	</div><!-- /.container -->
	<script th:src="@{/js/jquery-3.6.1.min.js}"></script>
	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/js/button-action.js}"></script>
</body>

</html>
